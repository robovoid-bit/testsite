<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-200 dark:bg-slate-900 dark:text-slate-100">

    <div class="w-full max-w-[600px] min-h-[680px] bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 p-6 flex flex-col justify-between relative">
        
        <div class="absolute top-4 right-4 z-50">
            <button onclick="toggleThemeMode()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-200 text-xs font-bold px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 transition-colors cursor-pointer">
                &amp;#127762; Toggle Theme
            </button>
        </div>

        <div id="app-content" class="flex-1 flex flex-col justify-between pt-6">
                <div class="flex flex-col h-full flex-1 justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-xl font-bold text-slate-800 dark:text-white">Your Bike Garage</h3>
                            <div>
                                <button onclick="showEditProfilePage()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1.5 rounded transition-colors mr-20">Edit Profile</button>
                            </div>
                        </div>
                        
                        <div class="overflow-y-auto max-h-[380px] pr-1 mb-4">
                            
                    <div class="flex flex-col items-center justify-center py-20 text-center">
                        <p class="text-sm italic text-slate-400 dark:text-slate-500">Your garage is empty. Add a bike to view tuning configs!</p>
                    </div>
                
                        </div>
                    </div>
                    
                    <div class="pt-4">
                        <button onclick="showAddBikePage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors">+ Add New Bike</button>
                    </div>
                </div>
            </div>

    </div>

    <script>
        const STORAGE_KEY = "mtb_suspension_app_data_v2";
        
        let user_data = {
            onboarding_complete: false,
            age: "16",
            weight_value: 75,
            weight_unit: "kg",
            bikes: []
        };

        function toggleThemeMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme_preference', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme_preference', 'dark');
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme_preference');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    user_data = JSON.parse(stored);
                } catch (e) {
                    console.error("Failed parsing configurations.", e);
                }
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(user_data));
        }

        function renderContainer(htmlContent) {
            document.getElementById('app-content').innerHTML = htmlContent;
        }

        function showOnboardingPage() {
            let ageOptions = "";
            for (let i = 5; i <= 90; i++) {
                ageOptions += `<option value="${i}" ${i === 16 ? 'selected' : ''}>${i}</option>`;
            }

            let weightOptions = "";
            for (let i = 30; i <= 160; i++) {
                weightOptions += `<option value="${i}" ${i === 75 ? 'selected' : ''}>${i}</option>`;
            }

            const html = `
                <div class="flex-1 flex flex-col justify-center">
                    <h2 class="text-2xl font-bold text-center mb-1 text-slate-800 dark:text-white">Welcome! Let's get set up</h2>
                    <p class="text-xs text-center italic text-slate-400 dark:text-slate-500 mb-8">*Note: There is no age requirement to use this app.</p>
                    
                    <div class="space-y-5 max-w-md mx-auto w-full">
                        <div>
                            <label class="block text-sm font-medium mb-1.5 text-slate-600 dark:text-slate-300">Select your Age:</label>
                            <select id="onboard-age" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-white">${ageOptions}</select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1.5 text-slate-600 dark:text-slate-300">Select your Rider Weight (with riding gear):</label>
                            <div class="flex gap-2">
                                <select id="onboard-weight" class="flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-white">${weightOptions}</select>
                                <select id="onboard-unit" class="w-24 rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                                    <option value="kg">kg</option>
                                    <option value="lbs">lbs</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pt-6">
                    <button onclick="handleOnboardingSubmit()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow">Complete Setup</button>
                </div>
            `;
            renderContainer(html);
        }

        function showEditProfilePage() {
            let ageOptions = "";
            for (let i = 5; i <= 90; i++) {
                ageOptions += `<option value="${i}" ${user_data.age == i ? 'selected' : ''}>${i}</option>`;
            }

            let weightOptions = "";
            for (let i = 30; i <= 160; i++) {
                weightOptions += `<option value="${i}" ${user_data.weight_value == i ? 'selected' : ''}>${i}</option>`;
            }

            const html = `
                <div class="flex-1 flex flex-col justify-center">
                    <h2 class="text-2xl font-bold text-center mb-8 text-slate-800 dark:text-white">Update Rider Profile</h2>
                    
                    <div class="space-y-5 max-w-md mx-auto w-full">
                        <div>
                            <label class="block text-sm font-medium mb-1.5 text-slate-600 dark:text-slate-300">Select your Age:</label>
                            <select id="edit-age" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-white">${ageOptions}</select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1.5 text-slate-600 dark:text-slate-300">Select your Rider Weight (with riding gear):</label>
                            <div class="flex gap-2">
                                <select id="edit-weight" class="flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-white">${weightOptions}</select>
                                <select id="edit-unit" class="w-24 rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                                    <option value="kg" ${user_data.weight_unit === 'kg' ? 'selected' : ''}>kg</option>
                                    <option value="lbs" ${user_data.weight_unit === 'lbs' ? 'selected' : ''}>lbs</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex gap-3 pt-6">
                    <button onclick="showHomePage()" class="flex-1 bg-slate-500 hover:bg-slate-600 text-white font-bold py-2.5 px-4 rounded-lg transition-colors">Cancel</button>
                    <button onclick="handleSaveProfileSubmit()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg transition-colors">Save Profile</button>
                </div>
            `;
            renderContainer(html);
        }

        function showHomePage() {
            let bikesHTML = "";
            
            if (!user_data.bikes || user_data.bikes.length === 0) {
                bikesHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-center">
                        <p class="text-sm italic text-slate-400 dark:text-slate-500">Your garage is empty. Add a bike to view tuning configs!</p>
                    </div>
                `;
            } else {
                bikesHTML = `<div class="space-y-3">`;
                user_data.bikes.forEach((bike, index) => {
                    bikesHTML += `
                        <div class="flex items-center justify-between p-4 bg-slate-100 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600">
                            <div onclick="showTuningDetailPage(${index})" class="flex items-center gap-4 flex-1 cursor-pointer">
                                <div class="w-16 h-12 bg-slate-300 dark:bg-slate-600 rounded flex items-center justify-center overflow-hidden flex-shrink-0">
                                    ${bike.image_data ? `<img src="${bike.image_data}" class="w-full h-full object-cover">` : `<span class="text-xs font-semibold text-slate-500 dark:text-slate-400">[No Photo]</span>`}
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-800 dark:text-white text-sm">${bike.name}</h4>
                                    <p class="text-xs text-slate-500 dark:text-slate-400">${bike.fork_brand} | ${bike.frame_type} | ${bike.riding_style}</p>
                                </div>
                            </div>
                            <button onclick="handleDeleteBike(${index})" class="text-sm bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-950/30 dark:hover:bg-red-900/50 dark:text-red-400 font-bold w-8 h-8 rounded-lg flex items-center justify-center transition-colors ml-2">✕</button>
                        </div>
                    `;
                });
                bikesHTML += `</div>`;
            }

            const html = `
                <div class="flex flex-col h-full flex-1 justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-xl font-bold text-slate-800 dark:text-white">Your Bike Garage</h3>
                            <div>
                                <button onclick="showEditProfilePage()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1.5 rounded transition-colors mr-20">Edit Profile</button>
                            </div>
                        </div>
                        
                        <div class="overflow-y-auto max-h-[380px] pr-1 mb-4">
                            ${bikesHTML}
                        </div>
                    </div>
                    
                    <div class="pt-4">
                        <button onclick="showAddBikePage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors">+ Add New Bike</button>
                    </div>
                </div>
            `;
            renderContainer(html);
        }

        function showAddBikePage() {
            const html = `
                <div class="flex-1 flex flex-col justify-center">
                    <h2 class="text-xl font-bold text-center mb-6 text-slate-800 dark:text-white">Configure New Bike</h2>
                    
                    <div class="space-y-4 max-w-md mx-auto w-full">
                        <div>
                            <label class="block text-xs font-medium mb-1 text-slate-600 dark:text-slate-300">Upload Bike Photo (Optional):</label>
                            <input type="file" id="bike-image" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 dark:file:bg-slate-700 dark:file:text-slate-200">
                        </div>

                        <div>
                            <label class="block text-xs font-medium mb-1 text-slate-600 dark:text-slate-300">Bike Nickname:</label>
                            <input type="text" id="bike-name" placeholder="e.g. My DH Rig, Custom DJ" class="w-full text-sm rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-slate-900 focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                        </div>

                        <div>
                            <label class="block text-xs font-medium mb-1 text-slate-600 dark:text-slate-300">Select Terrain / Riding Style:</label>
                            <select id="bike-style" class="w-full text-sm rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-slate-900 focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                                <option value="Balanced Trails">Balanced Trails</option>
                                <option value="Soft Trails / Mud">Soft Trails / Mud</option>
                                <option value="Big Jumps / Drops">Big Jumps / Drops</option>
                                <option value="Downhill (DH Race)">Downhill (DH Race)</option>
                                <option value="Dirt Jump (DJ / Pump Track)">Dirt Jump (DJ / Pump Track)</option>
                                <option value="Enduro / Technical">Enduro / Technical</option>
                                <option value="Freeride">Freeride</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium mb-1 text-slate-600 dark:text-slate-300">Front Fork Brand:</label>
                            <select id="bike-fork" class="w-full text-sm rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-slate-900 focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                                <option value="Fox">Fox</option>
                                <option value="RockShox">RockShox</option>
                                <option value="Ohlins">Ohlins</option>
                                <option value="Marzocchi">Marzocchi</option>
                                <option value="Suntour">Suntour</option>
                                <option value="Manitou">Manitou</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium mb-1.5 text-slate-600 dark:text-slate-300">Frame Layout Type:</label>
                            <div class="flex gap-2 p-1 bg-slate-100 dark:bg-slate-700 rounded-lg">
                                <button type="button" id="btn-hardtail" onclick="toggleShockField('Hardtail')" class="flex-1 py-1 text-xs font-medium rounded-md transition-colors bg-blue-600 text-white shadow">Hardtail</button>
                                <button type="button" id="btn-fullsusp" onclick="toggleShockField('Full Suspension')" class="flex-1 py-1 text-xs font-medium rounded-md transition-colors text-slate-700 dark:text-slate-300">Full Suspension</button>
                            </div>
                            <input type="hidden" id="bike-frame" value="Hardtail">
                        </div>

                        <div id="shock-brand-wrapper" class="hidden">
                            <label class="block text-xs font-medium mb-1 text-slate-600 dark:text-slate-300">Rear Shock Brand:</label>
                            <select id="bike-shock" class="w-full text-sm rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-slate-900 focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                                <option value="Fox">Fox</option>
                                <option value="RockShox">RockShox</option>
                                <option value="Ohlins">Ohlins</option>
                                <option value="Marzocchi">Marzocchi</option>
                                <option value="Cane Creek">Cane Creek</option>
                                <option value="DVO">DVO</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="flex gap-3 pt-6">
                    <button onclick="showHomePage()" class="flex-1 bg-slate-500 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded-lg transition-colors text-sm">Cancel</button>
                    <button onclick="handleCreateBikeSubmit()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors text-sm">Save Bike</button>
                </div>
            `;
            renderContainer(html);
        }

        function toggleShockField(selection) {
            document.getElementById('bike-frame').value = selection;
            const shockWrapper = document.getElementById('shock-brand-wrapper');
            const btnHardtail = document.getElementById('btn-hardtail');
            const btnFullSusp = document.getElementById('btn-fullsusp');
            
            if (selection === "Full Suspension") {
                shockWrapper.classList.remove('hidden');
                btnFullSusp.className = "flex-1 py-1 text-xs font-medium rounded-md transition-colors bg-blue-600 text-white shadow";
                btnHardtail.className = "flex-1 py-1 text-xs font-medium rounded-md transition-colors text-slate-700 dark:text-slate-300";
            } else {
                shockWrapper.classList.add('hidden');
                btnHardtail.className = "flex-1 py-1 text-xs font-medium rounded-md transition-colors bg-blue-600 text-white shadow";
                btnFullSusp.className = "flex-1 py-1 text-xs font-medium rounded-md transition-colors text-slate-700 dark:text-slate-300";
            }
        }

        function showTuningDetailPage(bikeIndex) {
            const bike = user_data.bikes[bikeIndex];
            let weight = user_data.weight_value;
            if (user_data.weight_unit === "lbs") {
                weight = weight * 0.453592;
            }
            
            const style = bike.riding_style;
            
            let fork_psi = 0;
            let fork_rebound = 0;
            const brand_fork = bike.fork_fork || bike.fork_brand;
            
            if (brand_fork === "Fox") {
                fork_psi = Math.floor(weight * 1.05);
                fork_rebound = 8;
            } else if (brand_fork === "RockShox") {
                fork_psi = Math.floor(weight * 0.95);
                fork_rebound = 6;
            } else if (brand_fork === "Ohlins") {
                fork_psi = Math.floor(weight * 1.2);
                fork_rebound = 12;
            } else {
                fork_psi = Math.floor(weight * 1.1);
                fork_rebound = 7;
            }
            
            if (style === "Soft Trails / Mud") {
                fork_psi -= 6;
                fork_rebound += 1;
            } else if (style === "Big Jumps / Drops") {
                fork_psi += 10;
                fork_rebound -= 1;
            } else if (style === "Downhill (DH Race)") {
                fork_psi += 5;
                fork_rebound -= 1;
            } else if (style === "Dirt Jump (DJ / Pump Track)") {
                fork_psi = Math.max(fork_psi + 25, 140);
                fork_rebound = Math.max(fork_rebound - 2, 3);
            } else if (style === "Enduro / Technical") {
                fork_psi += 2;
            } else if (style === "Freeride") {
                fork_psi += 12;
                fork_rebound -= 1;
            }
            
            let fork_bars = (fork_psi * 0.0689476).toFixed(2);

            let shockHTML = "";
            if (bike.frame_type === "Full Suspension") {
                let shock_psi = 0;
                let shock_rebound = 0;
                const brand_shock = bike.shock_brand;
                
                if (brand_shock === "Fox") {
                    shock_psi = Math.floor(weight * 2.7);
                    shock_rebound = 6;
                } else if (brand_shock === "RockShox") {
                    shock_psi = Math.floor(weight * 2.9);
                    shock_rebound = 5;
                } else if (brand_shock === "Ohlins") {
                    shock_psi = Math.floor(weight * 2.5);
                    shock_rebound = 8;
                } else {
                    shock_psi = Math.floor(weight * 2.8);
                    shock_rebound = 5;
                }
                
                if (style === "Soft Trails / Mud") {
                    shock_psi -= 12;
                    shock_rebound += 1;
                } else if (style === "Big Jumps / Drops") {
                    shock_psi += 20;
                    shock_rebound -= 1;
                } else if (style === "Downhill (DH Race)") {
                    shock_psi += 10;
                    shock_rebound -= 1;
                } else if (style === "Dirt Jump (DJ / Pump Track)") {
                    shock_psi = Math.max(shock_psi + 35, 220);
                    shock_rebound = Math.max(shock_rebound - 2, 2);
                } else if (style === "Enduro / Technical") {
                    shock_psi += 5;
                } else if (style === "Freeride") {
                    shock_psi += 25;
                    shock_rebound -= 1;
                }
                
                let shock_bars = (shock_psi * 0.0689476).toFixed(2);

                shockHTML = `
                    <div class="p-4 bg-slate-100 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600">
                        <h4 class="font-bold text-blue-600 dark:text-blue-400 text-sm mb-2">Rear Shock Setup (${bike.shock_brand})</h4>
                        <ul class="text-xs space-y-1 text-slate-700 dark:text-slate-300">
                            <li><strong>• Air Pressure:</strong> ${shock_psi} PSI (${shock_bars} Bars)</li>
                            <li><strong>• Rebound Damping:</strong> ${shock_rebound} Clicks from fully closed</li>
                        </ul>
                    </div>
                `;
            }

            const html = `
                <div class="flex flex-col h-full flex-1 justify-between">
                    <div class="space-y-4">
                        <h2 class="text-xl font-bold text-center text-slate-800 dark:text-white">${bike.name} Specs</h2>
                        
                        ${bike.image_data ? `
                            <div class="w-40 h-28 mx-auto bg-slate-200 dark:bg-slate-700 rounded-lg overflow-hidden border border-slate-300 dark:border-slate-600 shadow-inner">
                                <img src="${bike.image_data}" class="w-full h-full object-cover">
                            </div>
                        ` : ''}

                        <div class="p-4 bg-slate-100 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600">
                            <h4 class="font-bold text-blue-600 dark:text-blue-400 text-sm mb-2">Front Fork Setup (${bike.fork_brand})</h4>
                            <ul class="text-xs space-y-1 text-slate-700 dark:text-slate-300">
                                <li><strong>• Air Pressure:</strong> ${fork_psi} PSI (${fork_bars} Bars)</li>
                                <li><strong>• Rebound Damping:</strong> ${fork_rebound} Clicks from fully closed</li>
                            </ul>
                        </div>

                        ${shockHTML}
                    </div>

                    <div class="pt-6">
                        <button onclick="showHomePage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">&amp;larr; Back to Garage</button>
                    </div>
                </div>
            `;
            renderContainer(html);
        }

        function handleOnboardingSubmit() {
            user_data.age = document.getElementById('onboard-age').value;
            user_data.weight_value = parseInt(document.getElementById('onboard-weight').value);
            user_data.weight_unit = document.getElementById('onboard-unit').value;
            user_data.onboarding_complete = true;
            saveData();
            showHomePage();
        }

        function handleSaveProfileSubmit() {
            user_data.age = document.getElementById('edit-age').value;
            user_data.weight_value = parseInt(document.getElementById('edit-weight').value);
            user_data.weight_unit = document.getElementById('edit-unit').value;
            saveData();
            showHomePage();
        }

        function handleCreateBikeSubmit() {
            const nameInput = document.getElementById('bike-name').value.trim();
            if (!nameInput) {
                alert("Please enter a bike nickname.");
                return;
            }

            const files = document.getElementById('bike-image').files;
            const newBike = {
                name: nameInput,
                riding_style: document.getElementById('bike-style').value,
                fork_brand: document.getElementById('bike-fork').value,
                frame_type: document.getElementById('bike-frame').value,
                shock_brand: document.getElementById('bike-frame').value === "Full Suspension" ? document.getElementById('bike-shock').value : "None",
                image_data: null
            };

            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    newBike.image_data = reader.result;
                    user_data.bikes.push(newBike);
                    saveData();
                    showHomePage();
                }
                reader.readAsDataURL(files)[0];
            } else {
                user_data.bikes.push(newBike);
                saveData();
                showHomePage();
            }
        }

        function handleDeleteBike(index) {
            if (confirm("Are you sure you want to remove this bike from your garage?")) {
                user_data.bikes.splice(index, 1);
                saveData();
                showHomePage();
            }
        }

        function handleResetApp() {
            if (confirm("This will wipe all data. Proceed?")) {
                localStorage.removeItem(STORAGE_KEY);
                user_data = {
                    onboarding_complete: false,
                    age: "16",
                    weight_value: 75,
                    weight_unit: "kg",
                    bikes: []
                };
                showOnboardingPage();
            }
        }

        window.onload = function() {
            initTheme();
            loadData();
            
            if (user_data.onboarding_complete) {
                showHomePage();
            } else {
                showOnboardingPage();
            }
        };
    </script>

</body></html>
