<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Minute CSS Art Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f0f2f5;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 90px;
            background-color: #1e1e24;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .tool-title {
            color: #fff;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: -5px;
            opacity: 0.7;
        }

        /* Color Squares */
        .color-box {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .color-box:hover {
            transform: scale(1.1);
        }

        .color-box.active {
            border-color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        /* Utility Buttons */
        .btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 8px;
            background-color: #33333a;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #44444f;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.active {
            background-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }

        .btn-clear {
            margin-top: auto;
            background-color: #dc3545;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-clear:hover {
            background-color: #c82333;
        }

        /* Canvas Area */
        .canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #ffffff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <!-- Sidebar Tools -->
    <div class="sidebar">
        <div class="tool-title">Palette</div>
        <div class="color-box active" style="background-color: #ff4757;" data-color="#ff4757"></div>
        <div class="color-box" style="background-color: #2ed573;" data-color="#2ed573"></div>
        <div class="color-box" style="background-color: #1e90ff;" data-color="#1e90ff"></div>
        <div class="color-box" style="background-color: #ffa502;" data-color="#ffa502"></div>

        <div class="tool-title">Tools</div>
        <button class="btn" id="eraser-btn" title="Eraser">🧽</button>

        <button class="btn btn-clear" id="clear-btn" title="Clear Canvas">Clear</button>
    </div>

    <!-- Interactive Canvas -->
    <div class="canvas-container">
        <canvas id="paintCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const colorBoxes = document.querySelectorAll('.color-box');
        const eraserBtn = document.getElementById('eraser-btn');
        const clearBtn = document.getElementById('clear-btn');

        // Application State
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentColor = '#ff4757';
        let isEraserMode = false;

        // Resize canvas to dynamically fit its parent container
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            
            // Re-configure context styles after canvas resize as state resets
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 8;
        }

        // Setup Drawing Logic & Event Handlers
        function draw(e) {
            if (!isDrawing) return;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            
            // Set strokes based on active tool
            ctx.strokeStyle = isEraserMode ? '#ffffff' : currentColor;
            ctx.lineWidth = isEraserMode ? 40 : 8; // Thicker line for the eraser
            
            ctx.stroke();
            
            // Cache coordinates for the next move sequence
            lastX = e.offsetX;
            lastY = e.offsetY;
        }

        // Mouse Action Event Listeners
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            lastX = e.offsetX;
            lastY = e.offsetY;
        });

        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        // Sidebar Control Listeners
        colorBoxes.forEach(box => {
            box.addEventListener('click', (e) => {
                // Disable eraser mode
                isEraserMode = false;
                eraserBtn.classList.remove('active');

                // Update active selection UI
                colorBoxes.forEach(b => b.classList.remove('active'));
                box.classList.add('active');

                // Set current drawing color
                currentColor = box.getAttribute('data-color');
            });
        });

        eraserBtn.addEventListener('click', () => {
            isEraserMode = true;
            eraserBtn.classList.add('active');
            colorBoxes.forEach(b => b.classList.remove('active'));
        });

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Initialize and listen to screen adjustments
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
